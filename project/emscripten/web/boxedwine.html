<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BoxedWine</title>
    <meta name="description" content="boxedwine emulator">
    <meta name="keywords" content="emulator,wine,windows,x86,PC,emscripten,web assembly,wasm,boxedwine">
    <meta name="author" content="James Bryant, Kevin O'Dwyer">
    <link rel="stylesheet" type="text/css" href="boxedwine.css?v=2">
    <style>
      /* iPhone/iPad fix: lock the page to the visual viewport so Safari's
         URL bar animation doesn't crop the top/bottom of the canvas and
         the Start menu stays on screen. Mirrors boxedwine iphone.html. */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #000;
        overflow: hidden;
        position: fixed;
        inset: 0;
        overscroll-behavior: none;
        touch-action: none;
      }
      /* Allow form controls to still receive taps / scroll as needed. */
      input, textarea, button, label, select, .controls-panel, .controls-toggle-btn {
        touch-action: manipulation;
      }
    </style>
</head>

<body>
    <div id="spinner"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: white; font-family: system-ui, -apple-system, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="width: 40px; height: 40px; position: relative;">
                <div
                    style="width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: rgba(255, 255, 255, 0.9); border-radius: 50%; animation: iosSpin 0.8s linear infinite;">
                </div>
            </div>
            <style>
                @keyframes iosSpin {
                    from {
                        transform: rotate(0deg);
                    }

                    to {
                        transform: rotate(360deg);
                    }
                }
            </style>
            <div id="status" style="margin-top: 20px; font-weight: 500;">Downloading...</div>
            <div style="margin-top: 10px; width: 200px;">
                <progress value="0" max="100" id="progress" style="width: 100%;"></progress>
            </div>
        </div>
    </div>
    <div>
        <div id="controlsPanel" class="controls-panel">
            <div class="controls-container">
                <button id="startbtn" class="ios-button" style="display: none" onclick="start()">Start</button>
                <button id="uploadbtn" class="ios-button" style="display: none"
                    onclick="document.getElementById('upload').click()">Add File(s)</button>
                <input style="display: none" id="upload" name="upload"
                    onclick="document.getElementById('uploadbtn').click();"
                    onchange="startWithFiles(event.target.files);" type="file" multiple />
                <button id="downloadbtn" class="ios-button" style="display: none" onclick="buildGetFilesModal();">Get
                    File(s)</button>
                <button id="savestatebtn" class="ios-button" style="display: none" onclick="saveState();">Save

                <button id="loadstatebtn" class="ios-button" style="display: none"
                    onclick="document.getElementById('loadstatefile').click();">Load State</button>
                <input style="display: none" id="loadstatefile" type="file" accept=".boxedstate"
                    onchange="loadState(event.target.files[0]);" />
                <button id="persistpcbtn" class="ios-button" style="display: none" onclick="persistPcStorage();"
                    title="Save current PC state to browser storage. It will auto-load next time you open this page.">Persist
                    PC Storage</button>
                <button id="clearpersistbtn" class="ios-button" style="display: none"
                    onclick="clearPersistedPcStorage();" title="Clear the auto-loaded persisted PC state.">Clear
                    Persisted</button>
                <a style="display: none" id="modalLink" href="#openModal">Open</a>
                <a style="display: none" id="modalLinkExe" href="#openModalExe">Open</a>

                <div class="checkbox-group">
                    <label class="ios-checkbox-label" id="sound-checkbox" style="display: none">
                        <input type="checkbox" id="soundToggle" onclick="toggleSound();" /> Enable Sound
                    </label>
                    <label class="ios-checkbox-label">
                        <input type="checkbox" id="pointerLock" checked> Lock/hide mouse pointer
                    </label>
                    <input type="checkbox" id="disableMouseTracking" style="display:none">
                    <label class="ios-checkbox-label">
                        <input type="checkbox" id="showFPS" checked> Show FPS
                    </label>
                    <label class="ios-checkbox-label">
                        <input type="checkbox" id="showConsole" onclick="toggleConsole();" checked> Show console
                    </label>
                    <label class="ios-checkbox-label">
                        <input type="checkbox" id="resize"> Resize canvas
                    </label>
                    <input type="button" class="ios-button" style="margin-top: 10px;" value="Fullscreen"
                        onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">
                </div>
            </div>
        </div>
        <button id="controlsToggleBtn" class="controls-toggle-btn" onclick="toggleControls()">↑</button>

        <script>
            function toggleControls() {
                var panel = document.getElementById('controlsPanel');
                var btn = document.getElementById('controlsToggleBtn');
                if (panel.classList.contains('collapsed')) {
                    panel.classList.remove('collapsed');
                    btn.innerHTML = '↑';
                    btn.style.backgroundColor = '#000000';
                } else {
                    panel.classList.add('collapsed');
                    btn.innerHTML = '☰';
                    btn.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
                }
            }
            document.addEventListener('DOMContentLoaded', () => {
                var startBtn = document.getElementById('startbtn');
                if (startBtn) {
                    startBtn.addEventListener('click', () => {
                        var panel = document.getElementById('controlsPanel');
                        var btn = document.getElementById('controlsToggleBtn');
                        panel.classList.add('collapsed');
                        btn.innerHTML = '☰';
                        btn.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
                    });
                }
            });
        </script>
        <div id="dropzone" style="position:relative">
            <div class="emscripten_border">
                <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            </div>

                <div id="tree" class="scroll-style">

                <div>

        <div id="openModalExe" class="modalDialog">

            </div>
        </div>

    <script>
      function toggleZoom(checkbox) {
        try {
          if (!checkbox) return;
          if (checkbox.checked) {
            try {
              zoomIn();
            } catch (e) {}
          } else {
            try {
              zoomOut();
            } catch (e) {}
          }
        } catch (e) {}
      }
      // make it zoom function
      // return
      // TEMP: Spoof DPR to iPad-like value (2) on iPhone, force initial 800x600 canvas backing,
      // intercept createContext and then restore DPR after runtime init.
      var Module = typeof Module !== "undefined" ? Module : {};
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var isiPhone = /iPhone|iPod/.test(ua) && !/iPad/.test(ua);

          // Save original DPR and optionally spoof it for the very early init phase.
          var originalDPR =
            typeof window !== "undefined" && window.devicePixelRatio
              ? window.devicePixelRatio
              : 1;
          // Force desktop-like values on iPhone so runtime behaves like a laptop/iPad.
          // Desktop DPR typically 1; choose a backing that keeps the canvas at 800x600.
          var spoofDPR = 1;
          var restored = false;
          if (isiPhone) {
            try {
              Object.defineProperty(window, "devicePixelRatio", {
                configurable: true,
                get: function () {
                  return spoofDPR;
                },
              });
            } catch (e) {
              /* ignore if not allowed */
            }
          }

          // Additionally mock common size-related properties so the engine
          // believes it's running on a desktop/laptop. These are best-effort
          // and wrapped in try/catch because some browsers disallow redefining
          // these properties.
          if (isiPhone) {
            try {
              // var mockW = 1024;
              // var mockH = 768;
              var mockW = 800;
              var mockH = 800;
              // window.innerWidth / innerHeight
              Object.defineProperty(window, "innerWidth", {
                configurable: true,
                get: function () {
                  return mockW;
                },
              });
              Object.defineProperty(window, "innerHeight", {
                configurable: true,
                get: function () {
                  return mockH;
                },
              });
              // screen dimensions
              if (typeof screen !== "undefined") {
                try {
                  Object.defineProperty(screen, "width", {
                    configurable: true,
                    get: function () {
                      return mockW;
                    },
                  });
                } catch (e) {}
                try {
                  Object.defineProperty(screen, "height", {
                    configurable: true,
                    get: function () {
                      return mockH;
                    },
                  });
                } catch (e) {}
                try {
                  Object.defineProperty(screen, "availWidth", {
                    configurable: true,
                    get: function () {
                      return mockW;
                    },
                  });
                } catch (e) {}
                try {
                  Object.defineProperty(screen, "availHeight", {
                    configurable: true,
                    get: function () {
                      return mockH;
                    },
                  });
                } catch (e) {}
              }
              // documentElement client sizes
              try {
                Object.defineProperty(document.documentElement, "clientWidth", {
                  configurable: true,
                  get: function () {
                    return mockW;
                  },
                });
                Object.defineProperty(
                  document.documentElement,
                  "clientHeight",
                  {
                    configurable: true,
                    get: function () {
                      return mockH;
                    },
                  }
                );
              } catch (e) {}
            } catch (e) {}
          }

          // Ensure canvas exists and force initial laptop backing BEFORE wasm initializes
          var canvas = document.getElementById("canvas");
          if (!canvas) {
            canvas = document.createElement("canvas");
            canvas.id = "canvas";
            var dz = document.getElementById("dropzone") || document.body;
            dz.insertBefore(canvas, dz.firstChild);
          }

          // Force initial laptop backing (800x600) for the runtime
          try {
            canvas.width = 800;
            canvas.height = 800;
            canvas.style.width = "800px";
            canvas.style.height = "800px";
            canvas.style.display = "block";
          } catch (e) {}

          Module["canvas"] = canvas;

          // Intercept createContext assignment so we can ensure canvas backing is forced at creation time.
          (function () {
            var target = Module;
            var origCreate = null;
            Object.defineProperty(target, "createContext", {
              configurable: true,
              enumerable: true,
              get: function () {
                return origCreate;
              },
              set: function (fn) {
                origCreate = fn;
                var wrapper = function (canvasArg, useWebGL, setInModule) {
                  try {
                    canvasArg.width = 800;
                    canvasArg.height = 800;
                    canvasArg.style.width = "800px";
                    canvasArg.style.height = "800px";
                  } catch (e) {}
                  return origCreate(canvasArg, useWebGL, setInModule);
                };
                Object.defineProperty(target, "createContext", {
                  value: wrapper,
                  writable: true,
                  configurable: true,
                });
              },
            });
          })();

          // After runtime init, restore DPR and then trigger the resize/restore sequence to mimic a manual resize.
          var prevInit = Module["onRuntimeInitialized"];
          Module["onRuntimeInitialized"] = function () {
            try {
              if (typeof prevInit === "function") prevInit();
            } catch (e) {}
            // We keep the spoofed DPR and size mocks on iPhone so the runtime
            // will compute and allocate a desktop-like backing (800x600).
            try {
              if (isiPhone && !restored) {
                restored = true;
                // Ensure devicePixelRatio remains the spoofed value.
                Object.defineProperty(window, "devicePixelRatio", {
                  configurable: true,
                  get: function () {
                    return spoofDPR;
                  },
                });
              }
            } catch (e) {}
            // small delay then force a resize-like reflow so browser/emscripten recompute backing size
            setTimeout(function () {
              try {
                // Use the mocked size values on iPhone so runtime resizes like
                // a desktop/laptop device. Do not early-return here; the runtime
                // should perform its normal canvas allocation using the mocked
                // metrics above.

                var border =
                  document.querySelector(".emscripten_border") || document.body;
                var cssW = Math.min(
                  border.clientWidth || window.innerWidth,
                  border.clientHeight || window.innerHeight
                );
                var dpr = Math.max(
                  1,
                  Math.round(window.devicePixelRatio || originalDPR || 1)
                );
                canvas.style.width = Math.round(cssW) + "px";
                canvas.style.height = Math.round(cssW) + "px";
                canvas.width = Math.max(1, Math.floor(cssW * dpr));
                canvas.height = Math.max(1, Math.floor(cssW * dpr));
                if (
                  typeof Browser !== "undefined" &&
                  Browser.updateCanvasDimensions
                )
                  try {
                    Browser.updateCanvasDimensions(canvas);
                  } catch (e) {}
                window.dispatchEvent(new Event("resize"));
                // second pass for Safari timing quirks
                setTimeout(function () {
                  window.dispatchEvent(new Event("resize"));
                }, 120);
                // On iPhone, after the runtime has rendered into the larger backing
                // we want to scale the displayed canvas down to fit the device
                // viewport while keeping the backing resolution intact.
                // try {
                //   if (isiPhone) {
                //     // small delay to allow the first frame to render
                //     setTimeout(function() {
                //       try {
                //         var border2 = document.querySelector('.emscripten_border') || document.body;
                //         var maxW = border2.clientWidth || window.innerWidth;
                //         var maxH = border2.clientHeight || window.innerHeight;
                //         var targetScale = Math.min(maxW / 800, maxH / 600) || 1;
                //         var cssW = Math.max(1, Math.round(800 * targetScale));
                //         var cssH = Math.max(1, Math.round(600 * targetScale));
                //         // Apply CSS size while keeping the canvas backing (canvas.width/height)
                //         canvas.style.width = cssW + 'px';
                //         canvas.style.height = cssH + 'px';
                //         // Center the canvas within the border
                //         canvas.style.position = 'absolute';
                //         canvas.style.left = '50%';
                //         canvas.style.top = '50%';
                //         canvas.style.transform = 'translate(-50%, -50%)';
                //       } catch (e) {}
                //     }, 220);
                //   }
                // } catch (e) {}
              } catch (e) {}
            }, 120);
          };
        } catch (e) {}
      })();
    </script>

    <script>
      function hideStartupOverlay() {
        try {
          var el = document.getElementById("startupOverlay");
          if (el) el.style.display = "none";
        } catch (e) {}
      }
      // After boxedwine.js loads asynchronously, restore mobile mode.
      // Wait for the runtime to finish initializing, then restore real mobile
      // dimensions and rescale the canvas to fit the iPhone screen (portrait & landscape).
      // Keep 4:3 aspect ratio with width fitting the screen.
      (function () {
        // make it zoom function
        // return;

        var ua = navigator.userAgent || "";
        var isiPhone = /iPhone|iPod/.test(ua) && !/iPad/.test(ua);
        // if (!isiPhone) return;

        var canvas = document.getElementById("canvas");
        if (!canvas) return;

        function applyMobileScale() {
          try {
            // Get actual viewport dimensions
            var actualW = window.innerWidth || window.screen.width || 375;
            var actualH = window.innerHeight || window.screen.height || 667;

            // Reserve space for log controls area (~50px)
            var reservedForLog = 80;
            var availableH = actualH - reservedForLog;

            // Maintain 4:3 aspect ratio, fit to width
            // Canvas width = full screen width
            var cssW = actualW;
            var cssH = Math.round((actualW * 3) / 4); // 4:3 ratio

            // If height exceeds available space, scale down proportionally
            if (cssH > availableH) {
              var scaleDown = availableH / cssH;
              cssW = Math.round(cssW * scaleDown);
              cssH = Math.round(cssH * scaleDown);
            }

            // Apply mobile-friendly CSS size (keep backing unchanged at 800x600)
            canvas.style.width = cssW + "px";
            canvas.style.height = cssH + "px";
            canvas.style.position = "absolute";
            canvas.style.left = "50%";
            canvas.style.top = "50%";
            canvas.style.transform = "translate(-50%, -50%)";
          } catch (e) {}
        }

        // Poll for runtime init completion, then restore mobile mode
        var pollCount = 0;
        var pollInterval = setInterval(function () {
          pollCount++;
          // Check if runtime is ready or after a reasonable timeout (~3 seconds)
          if (
            pollCount > 60 ||
            (typeof Module !== "undefined" && Module.runtimeInitialized)
          ) {
            clearInterval(pollInterval);

            // Small delay to ensure first frame is rendered
            setTimeout(function () {
              try {
                // Restore real mobile dimensions by removing the mocks
                try {
                  //   delete Object.getOwnPropertyDescriptor(
                  //     window,
                  //     "devicePixelRatio"
                  //   );
                  //   delete Object.getOwnPropertyDescriptor(window, "innerWidth");
                  //   delete Object.getOwnPropertyDescriptor(window, "innerHeight");
                } catch (e) {}

                // applyMobileScale();

                // alert("zoom out")
                hideStartupOverlay();
                zoomOut(); // initial zoom out
                var dropzone = document.getElementById("dropzone");
                var logToggle = document.getElementById("logToggleWrap");
                if (logToggle && dropzone) {
                  var canvasTmp = document.querySelector(".emscripten_border");
                  if (canvasTmp && canvas.nextSibling) {
                    dropzone.insertBefore(logToggle, canvasTmp.nextSibling);
                  } else {
                    dropzone.appendChild(logToggle);
                  }
                }

                // Reapply scale on orientation change
                // window.addEventListener("orientationchange", function () {
                //   setTimeout(applyMobileScale, 100);
                // });

                // // Also reapply on resize for responsive behavior
                // window.addEventListener("resize", function () {
                //   setTimeout(applyMobileScale, 100);
                // });
              } catch (e) {}
            }, 100);
          }
        }, 50);
      })();
    </script>

    <script>
      function zoomOut() {
        try {
          var canvas = document.getElementById("canvas");
          if (!canvas) return;
          var actualW = window.innerWidth || window.screen.width || 375;
          var actualH = window.innerHeight || window.screen.height || 667;
          var reservedForLog = 80;
          var availableH = actualH - reservedForLog;

          var cssW = actualW;
          var cssH = Math.round((actualW * 3) / 4);

          if (cssH > availableH) {
            var scaleDown = availableH / cssH;
            cssW = Math.round(cssW * scaleDown);
            cssH = Math.round(cssH * scaleDown);
          }

          // restore canvas to fill the border and clear any explicit border sizing
          canvas.style.position = "";
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          canvas.style.left = "";
          canvas.style.top = "";
          canvas.style.transform = "";
          // Clear any forced size on the border so the checkbox area returns to normal flow
          try {
            var borderEl = document.querySelector(".emscripten_border");
            if (borderEl) {
              borderEl.style.height = "";
              borderEl.style.width = "";
              borderEl.style.position = "";
            }
          } catch (e) {}
        } catch (e) {}
      }
      function zoomIn() {
        try {
          var canvas = document.getElementById("canvas");
          if (!canvas) return;

          // Get actual viewport dimensions
          var actualW = window.innerWidth || window.screen.width || 375;
          var actualH = window.innerHeight || window.screen.height || 667;

          // Reserve space for log controls area (~50px)
          var reservedForLog = 80;
          var availableH = actualH - reservedForLog;

          // Maintain 4:3 aspect ratio, fit to width
          // Canvas width = full screen width
          var cssW = actualW;
          var cssH = Math.round((actualW * 3) / 4); // 4:3 ratio

          // If height exceeds available space, scale down proportionally
          if (cssH > availableH) {
            var scaleDown = availableH / cssH;
            cssW = Math.round(cssW * scaleDown);
            cssH = Math.round(cssH * scaleDown);
          }

          // Apply mobile-friendly CSS size (keep backing unchanged at 800x600)
          canvas.style.width = cssW + "px";
          canvas.style.height = cssH + "px";
          // Position canvas absolutely inside its border so we can control spacing below
          canvas.style.position = "absolute";
          canvas.style.left = "50%";
          canvas.style.top = "50%";
          canvas.style.transform = "translate(-50%, -50%)";
          // Ensure the border reserves enough space so the controls below move down
          try {
            var borderEl = document.querySelector(".emscripten_border");
            if (borderEl) {
              borderEl.style.height = cssH + "px";
              borderEl.style.width = cssW + "px";
              borderEl.style.position = "relative";
            }
          } catch (e) {}
        } catch (e) {}
      }
    </script>

    <script>
      const canvas = document.getElementById("canvas");
      function updateCanvasHiDPI() {
        // try {
        //   const border = document.querySelector('.emscripten_border');
        //   const cssSize = Math.min(border.clientWidth, border.clientHeight);
        //   const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
        //   const target = Math.max(1, Math.floor(cssSize * dpr));

        //  if (canvas.width !== target || canvas.height !== target) {
        //    canvas.width = target;
        //    canvas.height = target;
        //  }
        // } catch(e) {}
      }
      // Robust handler to adjust canvas/border while Zoom is active during resizes
      function handleZoomResize() {
        try {
          var zoomToggle = document.getElementById("zoomToggle");
          if (!zoomToggle || !zoomToggle.checked) return;
          if (!canvas) return;

          // reserved space for the controls below the canvas
          var reservedForLog = 80;
          var availableW = window.innerWidth || window.screen.width || 375;
          var availableH =
            (window.innerHeight || window.screen.height || 667) -
            reservedForLog;

          // Maintain 4:3 aspect ratio and fit within availableW x availableH
          var targetCssW = Math.min(
            availableW,
            Math.round((availableH * 4) / 3)
          );
          var targetCssH = Math.round((targetCssW * 3) / 4);

          // If calculated height still exceeds availableH, scale down further
          if (targetCssH > availableH) {
            var scaleDown = availableH / targetCssH;
            targetCssW = Math.round(targetCssW * scaleDown);
            targetCssH = Math.round(targetCssH * scaleDown);
          }

          // Apply sizes to border and position the canvas inside it
          try {
            var borderEl = document.querySelector(".emscripten_border");
            if (borderEl) {
              borderEl.style.width = targetCssW + "px";
              borderEl.style.height = targetCssH + "px";
              borderEl.style.position = "relative";
              borderEl.style.margin = "0 auto";
            }
          } catch (e) {}

          // Position and size canvas to fill the border while preserving backing
          try {
            canvas.style.position = "absolute";
            canvas.style.left = "50%";
            canvas.style.top = "50%";
            canvas.style.transform = "translate(-50%, -50%)";
            canvas.style.width = targetCssW + "px";
            canvas.style.height = targetCssH + "px";
          } catch (e) {}
        } catch (e) {}
      }
      // Keep focus on canvas so keyboard works if hardware keys are available
      // window.addEventListener('load', () => { try { canvas.focus(); } catch(e) {} updateCanvasHiDPI(); });
      window.addEventListener("resize", function () {
        updateCanvasHiDPI();
        handleZoomResize();
      });
      // Ensure we re-apply the shrink-to-fit when orientation changes on mobile
      window.addEventListener("orientationchange", function () {
        try {
          if (!canvas) return;
          // alert("orientationchange");
          var actualW = window.innerWidth || window.screen.width || 375;
          var actualH = window.innerHeight || window.screen.height || 667;
          var reservedForLog = 80;
          var availableH = actualH - reservedForLog;

          var cssW = actualW;
          var cssH = Math.round((actualW * 3) / 4);

          if (cssH > availableH) {
            var scaleDown = availableH / cssH;
            cssW = Math.round(cssW * scaleDown);
            cssH = Math.round(cssH * scaleDown);
          }

          // canvas.style.width = cssW + "px";
          // canvas.style.height = cssH + "px";
          // canvas.style.width = 200 + "px";
          // canvas.style.height = 200 + "px";
          // canvas.style.width = 500 + "px";
          // canvas.style.height = 500 + "px";
          canvas.style.width = "100%";
          canvas.style.height = "100%";

          // canvas.style.position = "absolute";
          // canvas.style.left = "50%";
          // canvas.style.top = "50%";
          canvas.style.left = "-50%";
          canvas.style.top = "-50%";
          canvas.style.transform = "translate(0%, 0%)";
          // After orientation settles, adjust layout for Zoom mode if active
          setTimeout(handleZoomResize, 150);
        } catch (e) {}
      });
      // Prevent page scrolling on iPhone (both axes)
      document.addEventListener(
        "touchmove",
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );
      // Toggle log visibility (hidden by default)
      const toggle = document.getElementById("toggleLog");
      const log = document.getElementById("output");
      const hiddenConsoleToggle = document.getElementById("showConsole");
      if (hiddenConsoleToggle) {
        // Make sure the engine's console flag starts off
        hiddenConsoleToggle.checked = false;
      }
      if (toggle && log) {
        // Ensure hidden on initial load and checkbox is unchecked
        toggle.checked = false;
        log.style.display = "none";
        toggle.addEventListener("change", () => {
          if (hiddenConsoleToggle) hiddenConsoleToggle.checked = toggle.checked;
          // Use engine's toggler for consistency if available
          if (typeof toggleConsole === "function") {
            try {
              toggleConsole();
            } catch (e) {
              /* fallback below */
            }
          }
          // Fallback to direct style
          log.style.display = toggle.checked ? "block" : "none";
        });
      }
    </script>
</body>
